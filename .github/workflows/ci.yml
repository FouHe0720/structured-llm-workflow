name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: python -m scripts.check_public
      - run: python -m examples.generate
      - run: python -m app.cli analyze examples/jd.txt --output outputs/jd.json
      - run: python -m eval.run_eval --output outputs/eval
      - uses: actions/upload-artifact@v4
        with:
          name: mock-evaluation-python-${{ matrix.python-version }}
          path: outputs/eval/
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t structured-llm-workflow:ci .
      - run: docker run --rm structured-llm-workflow:ci python -m app.cli analyze examples/jd.txt --output /tmp/report.json
