[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "structured-llm-workflow"
version = "0.1.0"
description = "Evidence-grounded document intelligence with a fixed, offline-first workflow"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "fastapi>=0.119,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.13,<1"]

[project.scripts]
document-workflow = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "schema", "prompts"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
